# mangobar
exec_once=mangobar &
# fcitx5
exec_once=fcitx5 --replace -d >/dev/null 2>&1 &
# obs-studio
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
# 不启动 wl-clip-persist：其接管剪贴板会导致原生 Wayland 飞书在内部复制后
# 无法粘贴外部文字/截图；保留 cliphist 记录文本历史，但不保证来源退出后仍可粘贴。
# Watch clipboard and store history
exec_once=wl-paste --type text --watch cliphist store &
# notification
exec_once=mako -c ~/.config/mako/config
# wallpaper
exec_once=swaybg --image ~/.config/mango/wallpaper.png --mode fill
exec_once=flameshot
