# Monitor Rules
monitorrule=name:DP-1,scale:1,x:1080,y:390,width:1920,height:1080,vrr:1,rr:0
monitorrule=name:HDMI-A-1,scale:1,x:0,y:0,width:1080,height:1920,vrr:1,rr:1
monitorrule=name:eDP-1,scale:1.25,x:3000,y:0,width:2880,height:1920,vrr:1

# Window Rules
# im
windowrule=tags:9,isfloating:1,appid:org.telegram.desktop
windowrule=tags:9,isfloating:1,appid:QQ,shadow:1,monitor:DP-1
windowrule=tags:9,isfloating:1,appid:wechat,shadow:1,monitor:DP-1
windowrule=tags:1,isfloating:0,appid:Bytedance-feishu,monitor:HDMI-A-1,focused_opacity:1,unfocused_opacity:0.85

# ide
windowrule=tags:3,isfloating:1,appid:jetbrains-studio,monitor:DP-1

windowrule=isfloating:1,appid:xdg-desktop-portal-gtk
windowrule=isfloating:1,appid:pcmanfm
windowrule=isfloating:1,appid:^mpv$

windowrule=isfloating:1,title:Translate
windowrule=width:800,height:900,title:Translate

windowrule=globalkeybinding:ctrl+alt-o,appid:com.obsproject.Studio
windowrule=globalkeybinding:ctrl+alt-n,appid:com.obsproject.Studio
# windowrule=isopensilent:1,appid:com.obsproject.Studio

# Blur disabled: screenshot tool needs pixel-perfect rendering
# windowrule=animation_type_close:none,appid:Sxiv

windowrule=isfloating:1,width:1500,height:900,appid:yesplaymusic
windowrule=animation_type_open:slide,appid:yesplaymusic
windowrule=animation_type_close:slide,appid:yesplaymusic

windowrule=isfloating:1,appid:clash-verge
windowrule=width:1500,height:900,appid:clash-verge
windowrule=animation_type_open:slide,animation_type_close:slide,appid:clash-verge

windowrule=isfloating:1,width:1500,height:900,appid:pot,title:Recognize

windowrule=isfloating:1,appid:blueman-manager
windowrule=width:1500,height:900,appid:blueman-manager

windowrule=isfloating:1,noblur:1,focused_opacity:1,title:预览
windowrule=isfloating:1,noblur:1,focused_opacity:1,title:图片*
windowrule=isfloating:1,noblur:1,focused_opacity:1,title:文件*

windowrule=animation_type_open:zoom,title:图片.*
windowrule=animation_type_open:zoom,title:文件.*



windowrule=isfloating:1,appid:Fuzzel
windowrule=isnoborder:1,appid:Fuzzel
windowrule=animation_type_open:slide,appid:Fuzzel
windowrule=animation_type_close:zoom,appid:Fuzzel

windowrule=isfloating:1,appid:xfce-polkit


windowrule=animation_type_open:none,nofadein:1,animation_type_close:none,nofadeout:1,appid:^com.gabm.satty$

windowrule=isterm:1,appid:St
# These applications can only strictly adhere to the tiling size when maximized
windowrule=force_fakemaximize:1,appid:org.gnome.SystemMonitor
windowrule=force_fakemaximize:1,appid:org.gnome.gThumb
windowrule=force_fakemaximize:1,appid:firefox

windowrule=tags:4,appid:Google-chrome
windowrule=tags:6,appid:obs
windowrule=tags:3,appid:jetbrains-studio

windowrule=animation_type_open:none,nofadein:1,title:wechat
windowrule=animation_type_close:none,nofadeout:1,title:wechat
# Blur disabled: overlay/PIP windows - too small for blur, wastes GPU
windowrule=noblur:1,isfloating:1,isoverlay:1,isnoborder:1,isunglobal:1,width:400,height:400,offsetx:9999,offsety:9999,appid:bongo-cat,title:BongoCat
windowrule=noblur:1,isfloating:1,isoverlay:1,isnoborder:1,isunglobal:1,width:280,height:200,offsetx:9999,offsety:9999,appid:mpv,title:video0 - mpv
windowrule=isfloating:1,isnosizehint:1,width:1500,height:900,appid:baidunetdisk,title:百度网盘
windowrule=isoverlay:1,appid:^com.gabm.satty$


# Blur disabled: video player - blur behind video is distracting and wastes GPU
windowrule=noblur:1,appid:^mpv$
windowrule=focused_opacity:1.0,appid:^mpv$
windowrule=focused_opacity:1.0,appid:^com.obsproject.Studio$

windowrule=blur:1,shadow:1,unfocused_opacity:0.55,focused_opacity:0.95,appid:foot
windowrule=blur:1,shadow:1,unfocused_opacity:0.55,focused_opacity:0.95,appid:kitty

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,open_as_floating:1,no_render_border:1

