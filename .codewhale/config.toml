# codewhale Configuration
# Get your API key from https://platform.deepseek.com
# Save it with: codewhale auth set --provider deepseek

# 隐私密钥已从本文件抽出（本文件可以安全提交到 git 仓库）：
# - 密钥统一存放在 .codewhale/secrets/secrets.json（已被 .gitignore 忽略）。
# - 仓库内提供模板 .codewhale/secrets/secrets.env.example ，
#   新机器上复制为 secrets.env 并填入密钥后，运行仓库根目录的
#   ./codewhale-setup.sh 即可自动写入 secret store。
# - 也可以直接导出环境变量（如 DEEPSEEK_API_KEY / OPENCODE_GO_API_KEY）。

# Base URL (default: https://api.deepseek.com/beta)
# Set https://api.deepseek.com to opt out of beta features.
# base_url = "https://api.deepseek.com/beta"

# Default model
default_text_model = "deepseek-v4-pro"
provider = "openai-codex"
auth_mode = "api_key"
harness_profiles = []
allow_shell = true

# Thinking mode (DeepSeek V4 reasoning effort):
# "auto" | "off" | "low" | "medium" | "high" | "max"
# Shift+Tab in the TUI cycles between off / high / max.
reasoning_effort = "auto"

[providers.deepseek]
auth_mode = "api_key"

[providers.openai]
auth_mode = "api_key"

[providers.xiaomi_mimo]
auth_mode = "api_key"

[providers.openai_codex]
auth_mode = "oauth"

# 本机专用:运行 codewhale auth external-consent --provider openai-codex --mode read-only 会在此处写回授权块
# [providers.openai_codex.external_credentials]
# access = "read_only"
# provider = "openai-codex"
# source = "codex_cli"
# path = "/home/jiannlee22/.codex/auth.json"
# consent_version = 1

[providers.opencode_go]
model = "deepseek-v4-flash"
auth_mode = "api_key"

[providers.opencode_zen]
model = "deepseek-v4-flash"
auth_mode = "api_key"

[providers.vimedia]
auth_mode = "api_key"
base_url = "https://dn-api-ai.vigame.cn/v1"
kind = "openai-compatible"
model = "gpt-5.6-sol-quanter"

[projects."~/"]
trust_level = "trusted"

[projects."~/.bun/bin"]
trust_level = "trusted"

[projects."~/.codewhale"]
trust_level = "trusted"

[projects."~/.npm-global"]
trust_level = "trusted"

[projects."~/Project/lawnchair_develop"]
trust_level = "trusted"

[projects."~/dotfile"]
trust_level = "trusted"

# 信任路径使用 ~ 展开，方便在其他机器上直接复用
[projects."~/nixos-config"]
trust_level = "trusted"

[tui]
status_items = [
    "mode",
    "model",
    "cost",
    "status",
    "agents",
    "git_branch",
]

# Startup update check
[update]
check_for_updates = true
# update_uri = "https://internal.mirror.example/codewhale/releases/latest"
